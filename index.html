<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>塔罗 - 手势占卜</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0614;
            --bg-purple: #1a0a2e;
            --gold: #d4a853;
            --gold-light: #e8d5b7;
            --glass: rgba(26, 10, 46, 0.6);
            --glass-border: rgba(212, 168, 83, 0.15);
            --text-primary: #e8d5b7;
            --text-secondary: rgba(232, 213, 183, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Serif SC', Georgia, serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw; height: 100vh;
            position: relative;
            overscroll-behavior: none;
        }

        #particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .page {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 10; padding: 20px;
            overflow-y: auto;
        }
        .page.active { opacity: 1; pointer-events: auto; }

        /* ===== 玻璃卡片 ===== */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 32px;
        }

        /* ===== 按钮 ===== */
        .mystic-btn {
            background: linear-gradient(135deg, rgba(212,168,83,0.15), rgba(212,168,83,0.05));
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 14px 48px;
            font-size: 16px; letter-spacing: 4px;
            font-family: 'Noto Serif SC', serif;
            border-radius: 30px; cursor: pointer;
            transition: all 0.4s ease;
            position: relative; overflow: hidden;
        }
        .mystic-btn:hover, .mystic-btn:active {
            background: linear-gradient(135deg, rgba(212,168,83,0.3), rgba(212,168,83,0.1));
            box-shadow: 0 0 30px rgba(212,168,83,0.3);
            transform: translateY(-2px);
        }
        .mystic-btn:disabled {
            opacity: 0.4; cursor: not-allowed;
            transform: none; box-shadow: none;
        }
        .mystic-btn-small { padding: 10px 32px; font-size: 14px; }

        /* ===== 输入框 ===== */
        .mystic-input {
            width: 100%; padding: 14px 18px;
            background: rgba(10,6,20,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            font-size: 15px; letter-spacing: 1px;
            outline: none; transition: all 0.3s ease;
        }
        .mystic-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212,168,83,0.2);
        }
        .mystic-input::placeholder { color: rgba(232,213,183,0.3); }

        .input-label {
            display: block; margin-bottom: 10px;
            font-size: 13px; color: var(--gold);
            letter-spacing: 3px;
        }

        /* ===== 首页 ===== */
        .home-title {
            font-family: 'Cinzel', serif;
            font-size: 64px; color: var(--gold);
            letter-spacing: 12px;
            text-shadow: 0 0 40px rgba(212,168,83,0.4), 0 0 80px rgba(212,168,83,0.2);
            animation: titleGlow 3s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 40px rgba(212,168,83,0.4), 0 0 80px rgba(212,168,83,0.2); }
            50% { text-shadow: 0 0 60px rgba(212,168,83,0.6), 0 0 120px rgba(212,168,83,0.3); }
        }
        .home-subtitle {
            font-size: 14px; color: var(--text-secondary);
            letter-spacing: 6px; margin-bottom: 60px;
        }
        .home-deck {
            width: 140px; height: 220px;
            position: relative; margin-bottom: 50px;
        }
        .home-deck .deck-card {
            position: absolute; inset: 0;
            border-radius: 12px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220"><rect width="140" height="220" fill="%231a0a2e" rx="12"/><rect x="4" y="4" width="132" height="212" fill="none" stroke="%23d4a853" stroke-width="1" rx="10"/><circle cx="70" cy="110" r="30" fill="none" stroke="%23d4a853" stroke-width="1"/><path d="M70 80 L70 140 M40 110 L100 110" stroke="%23d4a853" stroke-width="0.5"/><circle cx="70" cy="110" r="8" fill="none" stroke="%23d4a853" stroke-width="0.5"/></svg>') center/cover;
            border: 1px solid rgba(212,168,83,0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .home-deck .deck-card:nth-child(1) { transform: rotate(-3deg) translateX(-2px); }
        .home-deck .deck-card:nth-child(2) { transform: rotate(2deg) translateX(2px); }
        .home-deck .deck-card:nth-child(3) { transform: rotate(-1deg); }

        /* ===== 设置页 ===== */
        .setup-container {
            width: 100%; max-width: 420px;
            display: flex; flex-direction: column;
            gap: 24px;
        }
        .setup-title {
            font-family: 'Cinzel', serif;
            font-size: 24px; color: var(--gold);
            text-align: center; letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .spread-options {
            display: flex; gap: 12px;
        }
        .spread-option {
            flex: 1; padding: 16px;
            background: rgba(10,6,20,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px; cursor: pointer;
            text-align: center; transition: all 0.3s ease;
        }
        .spread-option:hover { border-color: rgba(212,168,83,0.4); }
        .spread-option.selected {
            border-color: var(--gold);
            background: rgba(212,168,83,0.1);
            box-shadow: 0 0 20px rgba(212,168,83,0.15);
        }
        .spread-option .option-title {
            font-size: 15px; color: var(--text-primary);
            font-weight: 600; margin-bottom: 4px;
        }
        .spread-option .option-desc {
            font-size: 12px; color: var(--text-secondary);
        }

        /* ===== 洗牌页 ===== */
        .shuffle-area {
            width: 100%; max-width: 400px;
            height: 320px; position: relative;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .shuffle-deck {
            width: 150px; height: 240px;
            position: relative; perspective: 1000px;
        }
        .shuffle-card {
            position: absolute; inset: 0;
            border-radius: 14px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 240"><rect width="150" height="240" fill="%231a0a2e" rx="14"/><rect x="6" y="6" width="138" height="228" fill="none" stroke="%23d4a853" stroke-width="1.2" rx="10"/><circle cx="75" cy="120" r="35" fill="none" stroke="%23d4a853" stroke-width="1"/><path d="M75 85 L75 155 M40 120 L110 120" stroke="%23d4a853" stroke-width="0.6"/><circle cx="75" cy="120" r="10" fill="none" stroke="%23d4a853" stroke-width="0.6"/></svg>') center/cover;
            border: 1px solid rgba(212,168,83,0.35);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            backface-visibility: hidden;
        }
        .shuffle-hint {
            position: absolute; bottom: 20px;
            font-size: 13px; color: var(--text-secondary);
            letter-spacing: 3px; text-align: center;
        }
        .shuffle-progress {
            position: absolute; bottom: 60px;
            width: 120px; height: 3px;
            background: rgba(212,168,83,0.15);
            border-radius: 3px; overflow: hidden;
        }
        .shuffle-progress-bar {
            height: 100%; width: 0%;
            background: var(--gold);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .shuffle-count {
            position: absolute; bottom: 70px;
            font-size: 12px; color: var(--gold);
            letter-spacing: 2px;
        }

        /* 洗牌动画 */
        @keyframes shuffleLeft {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-30px) rotate(-8deg) scale(0.95); }
            50% { transform: translateX(0) rotate(0deg); }
            75% { transform: translateX(15px) rotate(4deg) scale(0.98); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        @keyframes shuffleRight {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(30px) rotate(8deg) scale(0.95); }
            50% { transform: translateX(0) rotate(0deg); }
            75% { transform: translateX(-15px) rotate(-4deg) scale(0.98); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        .shuffle-anim-left { animation: shuffleLeft 0.4s ease; }
        .shuffle-anim-right { animation: shuffleRight 0.4s ease; }

        /* ===== 抽牌页（手势轮播） ===== */
        .draw-page {
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding: 20px; overflow-y: auto;
        }
        .draw-header {
            text-align: center; margin-bottom: 20px;
        }
        .draw-header .draw-title {
            font-family: 'Cinzel', serif;
            font-size: 22px; color: var(--gold);
            letter-spacing: 6px; margin-bottom: 8px;
        }
        .draw-header .draw-subtitle {
            font-size: 13px; color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* 星光背景 */
        .carousel-container {
            position: relative;
            width: 100%; max-width: 500px;
            height: 360px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, rgba(212,168,83,0.08) 0%, transparent 70%);
        }
        .star-field {
            position: absolute; inset: 0;
            pointer-events: none; overflow: hidden;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--gold);
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        .star:nth-child(3n) { animation-duration: 1.5s; }
        .star:nth-child(5n) { animation-duration: 2.5s; }
        .star:nth-child(7n) { animation-duration: 3s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 6px var(--gold); }
        }
        .star-trail {
            position: absolute;
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.3;
            animation: trailMove 4s linear infinite;
        }
        @keyframes trailMove {
            0% { transform: translateX(-100px) rotate(15deg); opacity: 0; }
            30% { opacity: 0.4; }
            70% { opacity: 0.4; }
            100% { transform: translateX(500px) rotate(15deg); opacity: 0; }
        }

        /* 抽取粒子爆炸特效 */
        .particle-container {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .particle.gold {
            background: radial-gradient(circle, #ffd700, #d4a853);
            box-shadow: 0 0 8px #d4a853, 0 0 16px rgba(212,168,83,0.5);
        }
        .particle.spark {
            background: #fff;
            box-shadow: 0 0 6px #fff, 0 0 12px #d4a853;
        }
        .particle.star-shape {
            background: transparent;
            box-shadow: none;
        }
        .particle.star-shape::before {
            content: '✦';
            color: #d4a853;
            font-size: 12px;
            text-shadow: 0 0 8px #d4a853;
        }
        @keyframes particleBurst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* 结果页星光飘落 */
        .magic-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .magic-star {
            position: absolute;
            color: #d4a853;
            font-size: 16px;
            text-shadow: 0 0 12px #d4a853, 0 0 24px rgba(212,168,83,0.5);
            animation: magicFloat 3s ease-out forwards;
            pointer-events: none;
        }
        @keyframes magicFloat {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            20% { transform: translateY(-20px) rotate(45deg) scale(1.2); opacity: 1; }
            100% { transform: translateY(-200px) rotate(180deg) scale(0); opacity: 0; }
        }
        .magic-ring {
            position: absolute;
            border: 2px solid rgba(212,168,83,0.4);
            border-radius: 50%;
            animation: ringExpand 2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ringExpand {
            0% { transform: scale(0); opacity: 1; border-width: 3px; }
            100% { transform: scale(4); opacity: 0; border-width: 0px; }
        }

        /* 结果卡牌光晕 */
        .result-card-wrapper {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
            animation: cardAppear 0.8s ease-out backwards;
        }
        .result-card-wrapper:nth-child(1) { animation-delay: 0s; }
        .result-card-wrapper:nth-child(2) { animation-delay: 0.3s; }
        .result-card-wrapper:nth-child(3) { animation-delay: 0.6s; }
        @keyframes cardAppear {
            0% { transform: translateY(40px) scale(0.8); opacity: 0; }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .result-flip-card {
            width: 120px; height: 190px;
            position: relative;
        }
        .result-flip-card .flip-card {
            width: 100%; height: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212,168,83,0.15), 0 0 40px rgba(138,92,200,0.1);
            animation: cardGlow 3s ease-in-out infinite;
        }
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(212,168,83,0.15), 0 0 40px rgba(138,92,200,0.1); }
            50% { box-shadow: 0 0 30px rgba(212,168,83,0.3), 0 0 60px rgba(138,92,200,0.2), 0 0 80px rgba(212,168,83,0.1); }
        }

        /* 轮播卡牌抽取时的发光 */
        .carousel-card.drawing {
            animation: drawBurst 0.6s ease-out forwards;
        }
        @keyframes drawBurst {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.15); filter: brightness(2) drop-shadow(0 0 30px #d4a853); }
            60% { transform: scale(1.1); filter: brightness(1.5) drop-shadow(0 0 50px #ffd700); }
            100% { transform: scale(0) translateY(-100px); opacity: 0; filter: brightness(3); }
        }

        /* 卡牌轮播 */
        .card-carousel {
            position: relative;
            width: 180px; height: 280px;
            perspective: 1200px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .carousel-card {
            position: absolute;
            width: 160px; height: 250px;
            left: 10px; top: 15px;
            border-radius: 14px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 250"><rect width="160" height="250" fill="%231a0a2e" rx="14"/><rect x="6" y="6" width="148" height="238" fill="none" stroke="%23d4a853" stroke-width="1.2" rx="10"/><circle cx="80" cy="125" r="38" fill="none" stroke="%23d4a853" stroke-width="1"/><path d="M80 87 L80 163 M42 125 L118 125" stroke="%23d4a853" stroke-width="0.6"/><circle cx="80" cy="125" r="12" fill="none" stroke="%23d4a853" stroke-width="0.6"/></svg>') center/cover;
            border: 1px solid rgba(212,168,83,0.4);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, filter 0.3s ease;
            cursor: grab;
            backface-visibility: hidden;
        }
        .carousel-card:active { cursor: grabbing; }
        .carousel-card.active {
            transform: translateZ(50px) scale(1.05);
            box-shadow: 0 0 40px rgba(212,168,83,0.3), 0 20px 60px rgba(0,0,0,0.6);
            border-color: rgba(212,168,83,0.7);
            z-index: 10;
        }
        .carousel-card.left {
            transform: translateX(-140px) translateZ(-30px) rotateY(25deg) scale(0.85);
            opacity: 0.5; filter: brightness(0.6);
        }
        .carousel-card.right {
            transform: translateX(140px) translateZ(-30px) rotateY(-25deg) scale(0.85);
            opacity: 0.5; filter: brightness(0.6);
        }
        .carousel-card.far-left {
            transform: translateX(-220px) translateZ(-60px) rotateY(35deg) scale(0.7);
            opacity: 0.2; filter: brightness(0.4);
        }
        .carousel-card.far-right {
            transform: translateX(220px) translateZ(-60px) rotateY(-35deg) scale(0.7);
            opacity: 0.2; filter: brightness(0.4);
        }
        .carousel-card.hidden {
            transform: translateZ(-100px) scale(0.5);
            opacity: 0;
        }

        /* 抽取动画 */
        @keyframes drawUp {
            0% { transform: translateZ(50px) scale(1.05); opacity: 1; }
            50% { transform: translateY(-100px) translateZ(80px) scale(1.1); opacity: 0.8; }
            100% { transform: translateY(-300px) translateZ(100px) scale(0.3); opacity: 0; }
        }
        .carousel-card.drawing {
            animation: drawUp 0.6s ease forwards;
        }

        /* 提示区域 */
        .draw-hint-area {
            margin-top: 20px;
            text-align: center;
        }
        .draw-hint-area .swipe-hint {
            font-size: 13px; color: var(--text-secondary);
            letter-spacing: 2px; margin-bottom: 8px;
        }
        .draw-hint-area .swipe-arrow {
            font-size: 24px; color: var(--gold);
            animation: arrowBounce 1.5s ease-in-out infinite;
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-8px); opacity: 1; }
        }
        .draw-progress {
            margin-top: 12px;
            font-size: 12px; color: var(--gold);
            letter-spacing: 2px;
        }
        /* 已抽牌区域 */
        .drawn-cards-area {
            width: 100%; max-width: 600px;
            min-height: 160px;
            display: flex; flex-wrap: wrap;
            align-items: center; justify-content: center;
            gap: 16px; padding: 16px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-top: 20px;
        }
        .drawn-card-slot {
            width: 100px; height: 160px;
            perspective: 1000px;
            position: relative;
        }
        .drawn-card-slot .slot-label {
            position: absolute; bottom: -20px; left: 0; right: 0;
            text-align: center; font-size: 11px;
            color: var(--gold); letter-spacing: 1px;
        }

        /* ===== 3D翻转卡牌 ===== */
        .flip-card {
            width: 100%; height: 100%;
            position: relative; perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }
        .flip-card-back {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 190"><rect width="120" height="190" fill="%231a0a2e" rx="12"/><rect x="5" y="5" width="110" height="180" fill="none" stroke="%23d4a853" stroke-width="1" rx="8"/><circle cx="60" cy="95" r="28" fill="none" stroke="%23d4a853" stroke-width="0.8"/><path d="M60 67 L60 123 M32 95 L88 95" stroke="%23d4a853" stroke-width="0.5"/><circle cx="60" cy="95" r="9" fill="none" stroke="%23d4a853" stroke-width="0.5"/></svg>') center/cover;
            border: 1px solid rgba(212,168,83,0.3);
        }
        .flip-card-front {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #1a0a2e, #2d1b4e);
            border: 1px solid rgba(212,168,83,0.3);
        }
        .flip-card-front img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            border-radius: 12px;
        }
        .flip-card.reversed .flip-card-front {
            transform: rotateY(180deg) rotate(180deg);
        }

        /* ===== 结果页 ===== */
        .result-layout {
            width: 100%; max-width: 900px;
            display: flex; flex-direction: column;
            align-items: center; gap: 30px;
        }
        .result-cards {
            display: flex; justify-content: center;
            gap: 30px; flex-wrap: wrap;
        }
        .result-card-wrapper {
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
        }
        .result-card-wrapper .card-info {
            text-align: center;
        }
        .result-card-wrapper .card-info .card-name {
            font-size: 14px; color: var(--gold);
            font-weight: 600; letter-spacing: 1px;
        }
        .result-card-wrapper .card-info .card-orientation {
            font-size: 12px; color: var(--text-secondary);
            margin-top: 3px;
        }
        .result-card-wrapper .position-name {
            font-size: 13px; color: var(--gold);
            letter-spacing: 3px;
        }
        .result-flip-card {
            width: 150px; height: 240px;
            perspective: 1000px;
        }
        .reading-box {
            width: 100%; max-width: 700px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);

            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startShuffle() {
            const btn = document.getElementById('shuffle-btn');
            btn.disabled = true;
            btn.textContent = '洗牌中...';

            let count = 0;
            const targetCount = 5;
            const interval = setInterval(() => {
                count++;
                shuffleCount++;
                const deck = document.getElementById('shuffle-deck');
                const dir = Math.random() > 0.5 ? 'left' : 'right';
                deck.classList.remove('shuffle-anim-left', 'shuffle-anim-right');
                void deck.offsetWidth;
                deck.classList.add(dir === 'left' ? 'shuffle-anim-left' : 'shuffle-anim-right');

                document.getElementById('shuffle-count').textContent = `洗牌 ${shuffleCount} 次`;
                document.getElementById('shuffle-progress-bar').style.width = Math.min(shuffleCount * 20, 100) + '%';

                if (count >= targetCount) {
                    clearInterval(interval);
                    setTimeout(() => goToDraw(), 500);
                }
            }, 500);
        }

        // 鼠标/触摸手势：左右滑动切换，向上滑动抽取
        function initCarouselGestures(container) {
            let startX = 0, startY = 0, lastX = 0, lastY = 0;
            let isDragging = false;

            const onStart = (x, y) => {

                startY = lastY = y;
                isDragging = true;
            };
            const onMove = (x, y) => {
                if (!isDragging) return;
                lastX = x;
                lastY = y;
            };
            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                const dx = lastX - startX;
                const dy = lastY - startY;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                if (absDy > absDx && dy < -60) {

                } else if (absDx > absDy && absDx > 40) {

            container.ontouchmove = (e) => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); };
            container.ontouchend = (e) => { e.preventDefault(); onEnd(); };

            container.onmousedown = (e) => {
                onStart(e.clientX, e.clientY);
                const mm = (me) => onMove(me.clientX, me.clientY);
                const mu = () => { onEnd(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };

        // 粒子爆炸特效
        function createParticleBurst(x, y) {
            const container = document.createElement('div');
            container.className = 'particle-container';
            container.style.left = x + 'px';
            container.style.top = y + 'px';

                p.className = 'particle ' + type;
                const size = Math.random() * 6 + 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';

                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const distance = Math.random() * 150 + 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                p.style.setProperty('--tx', tx + 'px');
                p.style.setProperty('--ty', ty + 'px');
                p.style.animation = `particleBurst ${0.6 + Math.random() * 0.4}s ease-out forwards`;
                p.style.animationDelay = Math.random() * 0.1 + 's';

                container.appendChild(p);

            flash.style.setProperty('--tx', '0px');
            flash.style.setProperty('--ty', '0px');

        // 卡牌轮播
        function initCardCarousel() {
            const container = document.getElementById('card-carousel');
            container.innerHTML = '';
            carouselCards = [];
            carouselIndex = Math.floor(Math.random() * shuffledDeck.length);

            // 创建所有卡牌元素（只显示牌背）

        function updateCarousel() {
            carouselCards.forEach((el, i) => {
                el.classList.remove('active', 'left', 'right', 'far-left', 'far-right', 'hidden');
                const diff = i - carouselIndex;
                if (diff === 0) {
                    el.classList.add('active');
                } else if (diff === -1 || (diff === shuffledDeck.length - 1)) {
                    el.classList.add('left');
                } else if (diff === 1 || (diff === -(shuffledDeck.length - 1))) {
                    el.classList.add('right');
                } else if (diff === -2 || (diff === shuffledDeck.length - 2)) {
                    el.classList.add('far-left');
                } else if (diff === 2 || (diff === -(shuffledDeck.length - 2))) {
                    el.classList.add('far-right');
                } else {
                    el.classList.add('hidden');
                }
            });
        }

            let isDragging = false;

            const onStart = (x, y) => {

                isDragging = true;

        function drawCurrentCard() {
            if (drawnCards.length >= cardsToDraw) return;

            const cardData = shuffledDeck[carouselIndex];
            const isReversed = Math.random() < 0.5;
            drawnCards.push({ ...cardData, isReversed });

            // 当前卡牌抽取动画 + 粒子爆炸
            const activeCard = carouselCards[carouselIndex];
            if (activeCard) {
                const rect = activeCard.getBoundingClientRect();
                createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
                activeCard.classList.add('drawing');
                setTimeout(() => {
                    activeCard.style.display = 'none';
                    carouselIndex = carouselIndex % shuffledDeck.length;
                    updateCarousel();
                }, 600);
            }

            addDrawnCard(cardData, isReversed, drawnCards.length - 1);
            updateDrawProgress();

            if (drawnCards.length >= cardsToDraw) {
                setTimeout(() => showResultInDrawPage(), 1200);
            }
        }

            document.getElementById('draw-progress').textContent = `已抽取 ${drawnCards.length} / ${cardsToDraw} 张`;

        // ===== AI 解读 =====
        async function generateReading() {
            const box = document.getElementById('reading-box');
            box.style.display = 'block';
            box.classList.add('loading');
            box.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">正在连接星辰的智慧</div>';

            const cardsText = drawnCards.map(c =>
                `${c.name}（${c.isReversed ? '逆位' : '正位'}）`
            ).join('、');

            const prompt = `你是一位拥有千年智慧的塔罗牌占卜师。请根据以下信息进行解读：

用户问题：${userQuestion || '无具体问题，寻求指引'}
抽到的牌：${cardsText}

请用神秘、优雅、温暖的语言写一篇完整的中文解读文章（不要分段，不要用标题分隔，不要用特殊符号）。直接以流畅的散文形式，将每张牌的含义和整体综合解读融合在一起，给出温暖有洞察力的建议。保持400-600字。`;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一位资深的塔罗牌占卜师，请根据用户的问题和抽到的牌（含正逆位）给出温暖、有洞察力的中文解读。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.8, max_tokens: 1200
                    })
                });
                const data = await res.json();
                box.classList.remove('loading');
                if (data.choices && data.choices[0]) {
                    // 清理所有特殊符号
                    let text = data.choices[0].message.content;
                    text = text.replace(/\*\*/g, '');        // 移除 **
                    text = text.replace(/#+/g, '');          // 移除 #
                    text = text.replace(/---+/g, '');        // 移除 ---
                    text = text.replace(/\n{3,}/g, '\n\n');  // 多个换行改为两个
                    text = text.replace(/\n/g, '<br>');      // 换行转为 br
                    box.innerHTML = text;
                } else {
                    generateLocalReading(box);
                }
            } catch (e) {
                box.classList.remove('loading');
                generateLocalReading(box);
            }
        }

        // ===== 粒子背景 =====
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let w = window.innerWidth, h = window.innerHeight;
            canvas.width = w; canvas.height = h;

            // 星星
            const stars = [];
            const starCount = Math.min(200, Math.floor(w * h / 8000));

            for (let i = 0; i < starCount; i++) {
                // 创建银河带效果：大部分星星集中在屏幕中央的对角线区域
                let x, y;
                const inGalaxy = Math.random() < 0.6;
                if (inGalaxy) {
                    // 银河带：从左下到右上的弧形分布
                    const t = Math.random();
                    x = t * w + (Math.random() - 0.5) * w * 0.4;
                    y = h - t * h + (Math.random() - 0.5) * h * 0.25;
                    x += Math.sin(t * Math.PI * 2) * 80;  // 弧形偏移
                } else {
                    x = Math.random() * w;
                    y = Math.random() * h;
                }

                stars.push({
                    x, y,
                    baseX: x, baseY: y,
                    size: Math.random() * 2 + 0.5,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random() * 0.6 + 0.2,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.01 + Math.random() * 0.03,
                    hue: Math.random() < 0.3 ? 45 : (Math.random() < 0.6 ? 200 : 280),  // 金色、蓝色、紫色
                    brightness: Math.random()
                });
            }

            // 流星
            const meteors = [];
            function createMeteor() {
                meteors.push({
                    x: Math.random() * w * 0.5,
                    y: Math.random() * h * 0.3,
                    length: 80 + Math.random() * 60,
                    speed: 8 + Math.random() * 6,
                    alpha: 1
                });
            }

            // 星云
            const nebulae = [];
            for (let i = 0; i < 3; i++) {
                nebulae.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: 100 + Math.random() * 150,
                    alpha: 0.03 + Math.random() * 0.02,
                    hue: [260, 280, 200][i],
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    pulse: Math.random() * Math.PI * 2
                });
            }

            let time = 0;
            let lastMeteor = 0;

            function animate() {
                time += 0.016;

                // 深空背景渐变
                const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h));
                grad.addColorStop(0, 'rgba(15, 10, 30, 0.3)');
                grad.addColorStop(0.5, 'rgba(8, 5, 20, 0.2)');
                grad.addColorStop(1, 'rgba(3, 2, 10, 0.1)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // 绘制星云
                nebulae.forEach(n => {
                    n.x += n.vx;
                    n.y += n.vy;
                    n.pulse += 0.01;
                    if (n.x < -n.radius) n.x = w + n.radius;
                    if (n.x > w + n.radius) n.x = -n.radius;
                    if (n.y < -n.radius) n.y = h + n.radius;
                    if (n.y > h + n.radius) n.y = -n.radius;

                    const a = n.alpha * (0.8 + 0.2 * Math.sin(n.pulse));
                    const nebulaGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
                    nebulaGrad.addColorStop(0, `hsla(${n.hue}, 60%, 40%, ${a})`);
                    nebulaGrad.addColorStop(0.5, `hsla(${n.hue}, 50%, 30%, ${a * 0.5})`);
                    nebulaGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = nebulaGrad;
                    ctx.fillRect(n.x - n.radius, n.y - n.radius, n.radius * 2, n.radius * 2);
                });

                // 绘制星星
                stars.forEach((s, i) => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.pulse += s.pulseSpeed;

                    // 边界循环
                    if (s.x < 0) s.x = w;
                    if (s.x > w) s.x = 0;
                    if (s.y < 0) s.y = h;
                    if (s.y > h) s.y = 0;

                    // 闪烁
                    const twinkle = 0.5 + 0.5 * Math.sin(s.pulse);
                    const alpha = s.alpha * twinkle;

                    // 光晕
                    if (s.brightness > 0.7) {
                        const glowGrad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 4);
                        glowGrad.addColorStop(0, `hsla(${s.hue}, 80%, 70%, ${alpha * 0.3})`);
                        glowGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = glowGrad;
                        ctx.fillRect(s.x - s.size * 4, s.y - s.size * 4, s.size * 8, s.size * 8);
                    }

                    // 星星本体
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${alpha})`;
                    ctx.fill();
                });

                // 绘制流星
                if (time - lastMeteor > 3 + Math.random() * 5) {
                    createMeteor();
                    lastMeteor = time;
                }

                meteors.forEach((m, idx) => {
                    m.x += m.speed;
                    m.y += m.speed * 0.6;
                    m.alpha -= 0.02;

                    if (m.alpha > 0) {
                        const meteorGrad = ctx.createLinearGradient(
                            m.x, m.y,
                            m.x - m.length * 0.7, m.y - m.length * 0.42
                        );
                        meteorGrad.addColorStop(0, `rgba(255, 250, 230, ${m.alpha})`);
                        meteorGrad.addColorStop(0.3, `rgba(212, 168, 83, ${m.alpha * 0.6})`);
                        meteorGrad.addColorStop(1, 'transparent');

                        ctx.beginPath();
                        ctx.moveTo(m.x, m.y);
                        ctx.lineTo(m.x - m.length * 0.7, m.y - m.length * 0.42);
                        ctx.strokeStyle = meteorGrad;
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // 流星头部光晕
                        const headGlow = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 6);
                        headGlow.addColorStop(0, `rgba(255, 255, 255, ${m.alpha})`);
                        headGlow.addColorStop(1, 'transparent');
                        ctx.fillStyle = headGlow;
                        ctx.fillRect(m.x - 6, m.y - 6, 12, 12);
                    }
                });

                // 移除消失的流星
                for (let i = meteors.length - 1; i >= 0; i--) {
                    if (meteors[i].alpha <= 0 || meteors[i].x > w || meteors[i].y > h) {
                        meteors.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w;
                canvas.height = h;
            });
        }

        window.onload = initParticles;
    </script>
</body>
</html>
